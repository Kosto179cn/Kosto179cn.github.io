<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosto 黑名单云管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0f1a; color: #cbd5e1; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .glass-card { background: rgba(22, 30, 46, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .rank-img { width: 32px; height: 16px; object-fit: contain; filter: drop-shadow(0 0 3px rgba(255,255,255,0.2)); }
        input, select, textarea { background: #1e293b !important; color: white !important; border: 1px solid #334155 !important; }
        input:focus { border-color: #3b82f6 !important; outline: none; }
        .history-tag { background: rgba(51, 65, 85, 0.5); padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-right: 4px; display: inline-block; margin-bottom: 2px; }
        .btn-action { transition: all 0.2s; }
        .btn-action:hover { transform: translateY(-1px); }
        /* Toast 通知 */
        #toastBox { position: fixed; top: 16px; right: 16px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
        .toast-item { padding: 12px 18px; border-radius: 10px; font-size: 13px; font-weight: bold; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: toastIn .25s ease; max-width: 320px; }
        .toast-info { background: #1d4ed8; }
        .toast-success { background: #047857; }
        .toast-error { background: #b91c1c; }
        .toast-warn { background: #b45309; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="p-4 md:p-8">

<!-- Toast 容器 -->
<div id="toastBox"></div>

<div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-6">
        <div>
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500 italic">
                KOSTO CLOUD MANAGER
            </h1>
            <p class="text-slate-500 text-xs tracking-widest uppercase mt-1">3D Tank Player Blacklist System</p>
        </div>
        <div class="flex flex-wrap gap-3 justify-center">
            <input type="password" id="giteeToken" placeholder="Gitee Token" class="px-4 py-2 rounded-lg text-sm w-48 shadow-inner">
            <button onclick="fetchData()" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-lg font-bold text-white btn-action shadow-lg shadow-blue-900/20">
                <i class="fas fa-sync-alt mr-2"></i>拉取云端名单
            </button>
        </div>
    </div>

    <!-- Server Tabs -->
    <div class="flex gap-1 mb-6 bg-slate-900/50 p-1 rounded-xl w-fit border border-white/5">
        <button id="tabCN" onclick="switchServer('cn')" class="px-6 py-2 rounded-lg font-bold text-sm transition bg-blue-600 text-white shadow-lg">国服 (3DTank)</button>
        <button id="tabEN" onclick="switchServer('en')" class="px-6 py-2 rounded-lg font-bold text-sm transition text-slate-400 hover:text-white">外服 (TankiOnline)</button>
    </div>

    <!-- Toolbar -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 mb-6">
        <div class="glass-card p-4 rounded-xl flex items-center justify-between border-l-4 border-blue-500">
            <div>
                <p class="text-slate-500 text-[10px] uppercase font-bold">已封锁总人数</p>
                <p class="text-2xl font-black text-white" id="statCount">0</p>
                <p class="text-[10px] text-slate-500 hidden" id="statFiltered"></p>
            </div>
            <i class="fas fa-user-shield text-blue-500/30 text-3xl"></i>
        </div>
        <div class="lg:col-span-2 glass-card p-2 rounded-xl flex items-center">
            <i class="fas fa-search ml-3 text-slate-500"></i>
            <input type="text" id="searchInput" placeholder="搜索 ID、昵称、曾用名、军团..." class="w-full bg-transparent border-none focus:ring-0 p-2 text-md">
        </div>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="batchClearByClan()" class="bg-rose-900/30 hover:bg-rose-900/50 text-rose-400 border border-rose-500/30 rounded-xl font-bold text-sm btn-action">
                <i class="fas fa-users-slash mr-2"></i>按军团清理
            </button>
            <button onclick="copyToOtherServer()" class="bg-emerald-900/30 hover:bg-emerald-900/50 text-emerald-400 border border-emerald-500/30 rounded-xl font-bold text-sm btn-action">
                <i class="fas fa-exchange-alt mr-2"></i><span id="copyBtnLabel">复制到外服</span>
            </button>
        </div>
    </div>

    <!-- Table Container -->
    <div class="glass-card rounded-2xl overflow-hidden shadow-2xl">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-900/50 text-slate-400 text-[11px] uppercase tracking-wider">
                    <tr>
                        <th class="p-4 font-bold">等级</th>
                        <th class="p-4 font-bold">基本信息 (ID/昵称)</th>
                        <th class="p-4 font-bold">所属军团</th>
                        <th class="p-4 font-bold">数据演变历史</th>
                    </tr>
                </thead>
                <tbody id="blacklistBody" class="divide-y divide-slate-800">
                    <!-- JS Data Rendering -->
                </tbody>
            </table>
        </div>
        <!-- 分页控件 -->
        <div id="pagination" class="flex items-center justify-center gap-4 py-3 border-t border-slate-800 text-sm text-slate-400"></div>
        <div id="loadingState" class="p-24 text-center hidden">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-500 mb-4"></div>
            <p class="text-slate-500 text-sm animate-pulse">正在安全连接至 Gitee 节点...</p>
        </div>
    </div>

    <!-- Bottom Actions -->
    <div class="mt-8 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="text-slate-500 text-xs">
            <i class="fas fa-info-circle mr-1"></i> 修改后请务必点击“推送至云端”按钮，否则更改不会生效。
            <span id="dirtyHint" class="text-amber-500 font-bold hidden ml-2"><i class="fas fa-circle-exclamation mr-1"></i>有未保存的修改</span>
        </div>
        <div class="flex gap-3">
            <button onclick="saveToCloud()" id="saveBtn" class="bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white px-10 py-3 rounded-xl font-black transition hidden shadow-xl shadow-blue-900/40 btn-action">
                <i class="fas fa-cloud-upload-alt mr-2"></i>推送至云端同步
            </button>
        </div>
    </div>
</div>

<script>
    let currentServer = 'cn'; // 默认国服

    const CONFIG = {
        repo: "Kosto179/kosto-battle-clicker-new",
        // 动态返回路径
        getPath: () => currentServer === 'cn' ? "player_blacklist_cn.json" : "player_blacklist_en.json",
        getOtherPath: () => currentServer === 'cn' ? "player_blacklist_en.json" : "player_blacklist_cn.json"
    };

    // 验证权限配置是否存在
    async function checkPermissionSync(token) {
        try {
            const url = `https://gitee.com/api/v5/repos/${CONFIG.repo}/contents/history_permissions.json?access_token=${token}&t=${Date.now()}`;
            const res = await fetchWithTimeout(url);
            if (res.status === 404) {
                toast('权限配置文件 history_permissions.json 尚未创建', 'error');
                return false;
            }
            if (!res.ok) {
                toast('权限配置同步失败', 'error');
                return false;
            }
            toast('权限配置已同步', 'success');
            return true;
        } catch (e) {
            toast('检查权限配置失败: ' + e.message, 'error');
            return false;
        }
    }

    const RANK_DATA = [
        "新兵", "二等兵", "一等兵", "下士", "中士", "上士", "三级军士长", "二级军士长", "一级军士长", "军士长", 
        "五级准尉", "四级准尉", "三级准尉", "二级准尉", "一级准尉", "特级准尉", "少尉", "中尉", "上尉", "少校", 
        "中校", "上校", "准将", "少将", "中将", "上将", "元帅", "陆军元帅", "统帅", "大元帅", "传奇"
    ];
    
    const RANK_HASHES = [
        "0171bce6", "14eac60d", "4d22497b", "7c510976", "c136316c", "59fac2c8", "2d5dc20c", "b563130a", "2e8435ba", "4aa99791",
        "747eb099", "12e6efa4", "b14aa84c", "499e0cc4", "70cf8f5b", "dfdc6796", "7c89e529", "1e5f0eb2", "dca802d5", "4d07ac16",
        "67355bb5", "02ac56c6", "99d83bfa", "3244a43f", "717ff925", "1b80d1fb", "72e4bb3d", "6ee30e89", "cc76cbcc", "acaaced1", "06d52fbe"
    ];

    const FETCH_TIMEOUT = 10000; // 请求超时时间
    const PAGE_SIZE = 50;        // 分页大小

    let blacklistData = {};
    let clanBlacklistData = [];  // 军团黑名单数据
    let baseData = null;         // 拉取时的数据快照，用于 SHA 冲突时三方合并
    let currentSha = "";
    let currentPage = 1;
    let dirty = false;           // 是否存在未推送的本地修改
    let historyPermissions = {}; // 历史记录查看权限 {uid: 'allow'/'deny'}，根据权限决定是否隐藏历史信息

    // ---------- 通用工具 ----------

    // HTML 转义，防止昵称/军团/历史等字段注入
    function escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
    }

    // 军衔值钳制到 1~31，防御脏数据
    function clampRank(rank) {
        let r = parseInt(rank) || 1;
        return Math.max(1, Math.min(31, r));
    }

    // 防抖：搜索输入避免每次按键都全量重渲染
    function debounce(fn, ms) {
        let t;
        return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    // Toast 通知（替代 alert 打断式弹窗）
    function toast(msg, type = 'info') {
        const box = document.getElementById('toastBox');
        const el = document.createElement('div');
        el.className = `toast-item toast-${type}`;
        el.textContent = msg;
        box.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2800);
        setTimeout(() => el.remove(), 3200);
    }

    // Base64 <-> UTF-8（使用 TextDecoder/TextEncoder，兼容中文）
    function b64ToUtf8(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
    }
    function utf8ToB64(str) {
        const bytes = new TextEncoder().encode(str);
        let bin = '';
        bytes.forEach(b => bin += String.fromCharCode(b));
        return btoa(bin);
    }

    // 深拷贝快照
    function snapshot(obj) { return JSON.parse(JSON.stringify(obj)); }

    // 脏状态标记
    function markDirty() {
        dirty = true;
        document.getElementById('dirtyHint').classList.remove('hidden');
    }
    function clearDirty() {
        dirty = false;
        document.getElementById('dirtyHint').classList.add('hidden');
    }

    // 带超时的 fetch
    async function fetchWithTimeout(url, options = {}) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT);
        try {
            return await fetch(url, { ...options, signal: controller.signal });
        } catch (e) {
            if (e.name === 'AbortError') throw new Error('请求超时，请检查网络后重试');
            throw new Error('网络连接失败，请检查网络后重试');
        } finally {
            clearTimeout(timer);
        }
    }

    // ---------- 数据读取 ----------

    // 解析云端文件内容，兼容新旧格式，返回 {players, clans}
    function parseFileContent(b64) {
        let rawData;
        try {
            rawData = JSON.parse(b64ToUtf8(b64));
        } catch (e) {
            throw new Error('云端数据格式损坏（JSON 解析失败），请手动检查仓库文件');
        }
        if (rawData && rawData.players) {
            return { players: rawData.players, clans: rawData.clans || [] };
        }
        return { players: rawData, clans: [] }; // 兼容老格式
    }

    // 拉取指定服务器文件；404 时返回空数据
    async function fetchRemoteFile(fileName, token) {
        const url = `https://gitee.com/api/v5/repos/${CONFIG.repo}/contents/${fileName}?access_token=${token}&t=${Date.now()}`;
        const res = await fetchWithTimeout(url);
        if (res.status === 404) return { sha: "", players: {}, clans: [] };
        if (!res.ok) throw new Error('连接失败: 请检查 Token 权限或仓库地址是否正确');
        const json = await res.json();
        const parsed = parseFileContent(json.content);
        return { sha: json.sha, players: parsed.players, clans: parsed.clans };
    }

    // 拉取历史记录查看权限配置
    async function fetchHistoryPermissions() {
        const token = document.getElementById('giteeToken').value;
        if (!token) return;
        try {
            const url = `https://gitee.com/api/v5/repos/${CONFIG.repo}/contents/history_permissions.json?access_token=${token}&t=${Date.now()}`;
            const res = await fetchWithTimeout(url);
            if (res.status === 404) { historyPermissions = {}; return; }
            if (!res.ok) { historyPermissions = {}; return; }
            const json = await res.json();
            const data = JSON.parse(b64ToUtf8(json.content));
            historyPermissions = data.permissions || {};
            console.log('历史查看权限已加载:', Object.keys(historyPermissions).length, '条');
        } catch (e) {
            console.error('加载历史查看权限失败:', e);
            historyPermissions = {};
        }
    }

    // 检查某 UID 是否允许查看历史
    function canViewHistory(uid) {
        const perm = historyPermissions[uid];
        return perm !== 'deny'; // 默认允许，只有明确标记'deny'才禁止
    }

    async function fetchData() {
        const token = document.getElementById('giteeToken').value;
        if (!token) return toast('请输入 Gitee Token！', 'warn');
        localStorage.setItem('gitee_token', token);

        document.getElementById('loadingState').classList.remove('hidden');
        document.getElementById('blacklistBody').innerHTML = '';

        try {
            const remote = await fetchRemoteFile(CONFIG.getPath(), token);
            blacklistData = remote.players;
            clanBlacklistData = remote.clans;
            baseData = snapshot(blacklistData);
            currentSha = remote.sha;
            currentPage = 1;
            clearDirty();
            await fetchHistoryPermissions();
            renderTable();
            document.getElementById('saveBtn').classList.remove('hidden');
            toast(`拉取成功，共 ${Object.keys(blacklistData).length} 条记录`, 'success');
        } catch (e) {
            console.error(e);
            toast('加载失败: ' + e.message, 'error');
        } finally {
            document.getElementById('loadingState').classList.add('hidden');
        }
    }

    // ---------- 渲染 ----------

    function renderTable() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
        const tbody = document.getElementById('blacklistBody');
        const allIds = Object.keys(blacklistData);

        // 搜索过滤
        const filtered = allIds.filter(id => {
            if (!searchTerm) return true;
            const user = blacklistData[id] || {};
            const nickname = user.nickname || '';
            const clan = user.clan || '';
            const history = (user.history || []).join(' ');
            const clanHistory = (user.clanHistory || []).join(' ');
            return id.includes(searchTerm) ||
                   nickname.toLowerCase().includes(searchTerm) ||
                   clan.toLowerCase().includes(searchTerm) ||
                   history.toLowerCase().includes(searchTerm) ||
                   clanHistory.toLowerCase().includes(searchTerm);
        });

        // 统计：总数恒定显示，筛选时展示 "筛选数 / 总数"
        document.getElementById('statCount').textContent = allIds.length;
        const statFiltered = document.getElementById('statFiltered');
        if (searchTerm && filtered.length !== allIds.length) {
            statFiltered.textContent = `筛选命中 ${filtered.length} 人`;
            statFiltered.classList.remove('hidden');
        } else {
            statFiltered.classList.add('hidden');
        }

        // 分页计算
        const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageIds = filtered.slice(start, start + PAGE_SIZE);

        // 空状态提示
        if (pageIds.length === 0) {
            tbody.innerHTML = `
                <tr><td colspan="4" class="p-16 text-center text-slate-500">
                    <i class="fas ${allIds.length === 0 ? 'fa-cloud-arrow-down' : 'fa-magnifying-glass'} text-4xl mb-4 block text-slate-700"></i>
                    ${allIds.length === 0
                        ? '云端暂无数据'
                        : '未找到匹配的记录，试试更换搜索关键词'}
                </td></tr>`;
            renderPagination(filtered.length, totalPages);
            return;
        }

        // 渲染历史标签（内容全部转义）
        const renderHistory = (list, title) => {
            if (!list || list.length === 0) return '';
            return `<div class="flex flex-wrap items-center mt-1">
                        <span class="text-[9px] text-slate-600 mr-2 uppercase font-bold">${title}:</span>
                        ${list.map(h => `<span class="history-tag">${escapeHtml(h)}</span>`).join('')}
                    </div>`;
        };

        // DocumentFragment 一次性插入，避免逐行 append 触发多次重排
        const frag = document.createDocumentFragment();
        pageIds.forEach(id => {
            const user = blacklistData[id] || {};
            const nickname = user.nickname || '';
            const clan = user.clan || '';
            const rank = clampRank(user.rank);
            const allowed = canViewHistory(id);

            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-800/30 transition-colors group';
            tr.innerHTML = `
                <td class="p-4">
                    <div class="flex flex-col items-start gap-1">
                        <img src="${getRankIconUrl(rank)}" loading="lazy" class="rank-img" alt="${escapeHtml(RANK_DATA[rank - 1])}">
                        <span class="text-[10px] font-bold text-slate-500 uppercase">${escapeHtml(RANK_DATA[rank - 1])}</span>
                    </div>
                </td>
                <td class="p-4">
                    <div class="font-mono text-[10px] text-blue-500/80 mb-1"># ${escapeHtml(id)}</div>
                    <div class="text-white font-black text-lg">${escapeHtml(nickname)}</div>
                </td>
                <td class="p-4 text-sm">
                    ${clan ? `<span class="bg-indigo-900/30 text-indigo-400 px-3 py-1 rounded-full border border-indigo-500/20 font-bold">${escapeHtml(clan)}</span>` : '<span class="text-slate-700 italic">散人</span>'}
                </td>
                <td class="p-4">
                    <div class="max-w-xs">
                        ${allowed ? renderHistory(user.history, '更名') : '<span style="color:#64748b">🚫 已隐藏</span>'}
                        ${renderHistory(user.clanHistory, '军团')}
                        <div class="text-[9px] text-slate-600 mt-2 italic"><i class="far fa-clock mr-1"></i>封锁于: ${escapeHtml(user.addedAt || '未知')}</div>
                    </div>
                </td>
            `;
            frag.appendChild(tr);
        });
        tbody.innerHTML = '';
        tbody.appendChild(frag);
        renderPagination(filtered.length, totalPages);
    }

    function renderPagination(filteredCount, totalPages) {
        const el = document.getElementById('pagination');
        if (filteredCount === 0) { el.innerHTML = ''; return; }
        const btnBase = 'px-4 py-1.5 rounded-lg font-bold text-xs transition';
        el.innerHTML = `
            <button ${currentPage <= 1 ? 'disabled' : ''} onclick="gotoPage(${currentPage - 1})"
                class="${btnBase} ${currentPage <= 1 ? 'text-slate-700 cursor-not-allowed' : 'bg-slate-800 hover:bg-slate-700 text-white'}">
                <i class="fas fa-chevron-left mr-1"></i>上一页
            </button>
            <span class="text-xs">第 <b class="text-white">${currentPage}</b> / ${totalPages} 页 · 共 ${filteredCount} 条</span>
            <button ${currentPage >= totalPages ? 'disabled' : ''} onclick="gotoPage(${currentPage + 1})"
                class="${btnBase} ${currentPage >= totalPages ? 'text-slate-700 cursor-not-allowed' : 'bg-slate-800 hover:bg-slate-700 text-white'}">
                下一页<i class="fas fa-chevron-right ml-1"></i>
            </button>
        `;
    }

    function gotoPage(p) {
        currentPage = p;
        renderTable();
    }

    function getRankIconUrl(rank) {
        const r = clampRank(rank);
        const prefix = r < 10 ? '0' + r : r;
        return `https://s.eu.tankionline.com/static/images/${prefix}.${RANK_HASHES[r - 1]}.webp`;
    }

    // ---------- 服务器切换 ----------

    function switchServer(srv) {
        if (srv === currentServer) return;
        if (dirty && !confirm('当前服务器有未推送的修改，切换后将丢失，确定继续吗？')) return;
        currentServer = srv;
        // 样式切换
        const activeCls = 'px-6 py-2 rounded-lg font-bold text-sm transition bg-blue-600 text-white shadow-lg';
        const idleCls = 'px-6 py-2 rounded-lg font-bold text-sm transition text-slate-400 hover:text-white';
        document.getElementById('tabCN').className = srv === 'cn' ? activeCls : idleCls;
        document.getElementById('tabEN').className = srv === 'en' ? activeCls : idleCls;
        document.getElementById('copyBtnLabel').textContent = srv === 'cn' ? '复制到外服' : '复制到国服';

        // 重置本地状态并重新拉取
        blacklistData = {};
        clanBlacklistData = [];
        baseData = null;
        currentSha = "";
        clearDirty();
        renderTable();
        const token = document.getElementById('giteeToken').value;
        if (token) fetchData();
        else toast('已切换服务器，请输入 Token 后拉取名单', 'info');
    }

    // ---------- 增删改 ----------

    // 搜索防抖
    document.getElementById('searchInput').addEventListener('input', debounce(() => {
        currentPage = 1;
        renderTable();
    }, 150));

    // 批量按军团删除
    function batchClearByClan() {
        const clanName = prompt('请输入要清理的军团名 (完全匹配):');
        if (!clanName) return;

        const toDelete = Object.keys(blacklistData).filter(id => (blacklistData[id] || {}).clan === clanName);

        if (toDelete.length === 0) {
            toast(`未找到军团为 [${clanName}] 的用户。`, 'warn');
            return;
        }

        if (confirm(`检测到该军团共有 ${toDelete.length} 名成员，确定全部移除吗？`)) {
            toDelete.forEach(id => delete blacklistData[id]);
            markDirty();
            renderTable();
            toast(`已从本地列表移除 ${toDelete.length} 人，请记得同步到云端！`, 'success');
        }
    }

    // ---------- 双服复制 ----------

    // 将当前服名单复制到另一服（直接写云端目标文件）
    async function copyToOtherServer() {
        const token = document.getElementById('giteeToken').value;
        if (!token) return toast('请先输入 Gitee Token！', 'warn');
        if (Object.keys(blacklistData).length === 0) return toast('当前名单为空，无可复制数据', 'warn');

        const targetName = currentServer === 'cn' ? '外服' : '国服';
        if (!confirm(`确定将当前 ${Object.keys(blacklistData).length} 条记录覆盖复制到【${targetName}】名单吗？\n（目标文件现有数据将被完全替换）`)) return;

        toast(`正在读取${targetName}云端文件...`, 'info');
        try {
            const target = await fetchRemoteFile(CONFIG.getOtherPath(), token);
            const saveData = { players: blacklistData, clans: clanBlacklistData };
            const content = utf8ToB64(JSON.stringify(saveData, null, 2));
            const url = `https://gitee.com/api/v5/repos/${CONFIG.repo}/contents/${CONFIG.getOtherPath()}`;
            const res = await fetchWithTimeout(url, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    access_token: token,
                    content: content,
                    sha: target.sha,
                    message: `Blacklist copied from ${currentServer} via Kosto Web UI: ` + new Date().toLocaleString()
                })
            });
            if (!res.ok) throw new Error('写入失败，请重试或检查 Token 权限');
            toast(`已成功复制 ${Object.keys(blacklistData).length} 条记录到${targetName}！`, 'success');
        } catch (e) {
            toast('复制失败: ' + e.message, 'error');
        }
    }

    // ---------- 云端同步 ----------

    // 构建推送载荷
    function buildSaveContent() {
        const saveData = { players: blacklistData, clans: clanBlacklistData };
        return utf8ToB64(JSON.stringify(saveData, null, 2));
    }

    // 发起 PUT 推送
    async function pushToGitee(token, sha, content, message) {
        const url = `https://gitee.com/api/v5/repos/${CONFIG.repo}/contents/${CONFIG.getPath()}`;
        return fetchWithTimeout(url, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ access_token: token, content: content, sha: sha, message: message })
        });
    }

    // SHA 冲突时重新获取最新 sha 后全量覆盖推送（不做合并，本地数据完全覆盖云端）
    async function forceFullPush(token) {
        toast('检测到云端已更新，正在获取最新版本号以完全覆盖...', 'info');
        const remote = await fetchRemoteFile(CONFIG.getPath(), token);
        currentSha = remote.sha; // 仅更新版本号，云端内容将被本地数据完全覆盖
        const res = await pushToGitee(token, currentSha, buildSaveContent(),
            'Blacklist force-updated via Kosto Web UI: ' + new Date().toLocaleString());
        if (!res.ok) throw new Error('覆盖推送仍失败，请刷新页面重试');
        const resJson = await res.json();
        currentSha = resJson.content.sha;
        clearDirty();
        toast('已用本地数据完全覆盖云端并同步成功！', 'success');
    }

    async function saveToCloud() {
        const token = document.getElementById('giteeToken').value;
        if (!confirm('警告：此操作将用当前列表【完全覆盖】云端黑名单数据，确定继续吗？')) return;

        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>正在同步数据流...';

        try {
            const res = await pushToGitee(token, currentSha, buildSaveContent(),
                'Blacklist updated via Kosto Web UI: ' + new Date().toLocaleString());

            if (res.status === 409) {
                // SHA 冲突：云端已被其他会话修改。本系统语义为全量推送，不做合并
                if (confirm('云端数据已被修改（SHA 冲突）。\n\n是否仍以本地数据完全覆盖云端？\n（选择“取消”则保留云端现状，请重新拉取后再编辑）')) {
                    await forceFullPush(token);
                } else {
                    toast('已取消推送：云端数据已变化，请先重新拉取', 'warn');
                }
                return;
            }

            if (!res.ok) throw new Error('同步失败：网络中断或 Token 权限不足，请重试');

            const resJson = await res.json();
            currentSha = resJson.content.sha;
            baseData = snapshot(blacklistData);
            clearDirty();
            toast('云端数据已同步成功！', 'success');
        } catch (e) {
            toast(e.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-cloud-upload-alt mr-2"></i>推送至云端同步';
        }
    }

    // ---------- 初始化 ----------

    window.onload = () => {
        const savedToken = localStorage.getItem('gitee_token');
        if (savedToken) {
            document.getElementById('giteeToken').value = savedToken;
            // 有 token 自动拉取云端名单
            fetchData();
        }

        // 未保存修改时离开页面提醒
        window.addEventListener('beforeunload', e => {
            if (dirty) { e.preventDefault(); e.returnValue = ''; }
        });

        renderTable();
    };
</script>
</body>
</html>

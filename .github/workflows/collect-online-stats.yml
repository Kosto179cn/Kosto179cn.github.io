name: Collect CN Server Online Stats

# 每小时第 23 分钟（UTC）访问一次官方状态接口，按 Asia/Shanghai 归到对应小时。
# 分钟选 23 而不是整点/整点后 5 分：GitHub 官方明确「整点前后是 schedule 高负载窗口」，
# 同仓库的 update-pages-json.yml 用整点 cron，实测延迟可达 40 分钟以上。
# 本次同时通过「修改 cron 值」重新激活被 GitHub 停用的 scheduled 触发器
# （官方文档：deactivated 的定时工作流必须由写权限用户提交一次 cron 变更才会重新激活）。
# 注意：schedule 不保证准点，数据以脚本采集到的本地小时为准，不是以触发时间为准。
on:
  schedule:
    - cron: '23 * * * *'
  # 配置自检：改动本文件时立即跑一次，用于确认采集链路可用。
  # 数据提交只改 data/online/**，不匹配这里的 paths，因此不会自触发成死循环。
  push:
    paths:
      - '.github/workflows/collect-online-stats.yml'
  workflow_dispatch:
    inputs:
      date:
        description: '可选：手动补录日期 YYYY-MM-DD'
        required: false
      hour:
        description: '可选：手动补录小时 0-23'
        required: false

permissions:
  contents: write

# 与 update-pages-json.yml 的整点任务错开 23 分钟，避免同时 push 产生冲突
concurrency:
  group: kosto-hourly-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch balancer snapshot and archive
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_HOUR: ${{ inputs.hour }}
        run: |
          ARGS=""
          if [ -n "$INPUT_DATE" ]; then ARGS="$ARGS --date $INPUT_DATE"; fi
          if [ -n "$INPUT_HOUR" ]; then ARGS="$ARGS --hour $INPUT_HOUR"; fi
          python scripts/fetch_online_stats.py $ARGS

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data/online)" ]; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          # 其它整点任务可能已经推过，先 rebase 再提交
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add data/online
          git commit -m "chore(data): hourly CN online stats $(date -u +'%Y-%m-%dT%H:00Z')"
          git push

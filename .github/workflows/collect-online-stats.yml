name: Collect CN Server Online Stats

# 定时采集已交给 Cloudflare Worker（独立仓库 Kosto179cn/collect-online-stats-trigger，
# cron "30 * * * *"），由它调用 workflow_dispatch 准点触发本工作流。
# 原生 schedule 已移除：整点/半点窗口实测延迟可达 40 分钟以上，且与 Worker 并存时
# 每小时会重复采集两次（同一小时互相覆盖，白烧一次运行额度）。
#
# 代价：移除 schedule 后本工作流没有任何兜底定时。若 Worker 故障或 GITHUB_TOKEN 过期，
# 数据会停更且不会告警——需定期查看 Worker 的 Workers Logs 与 PAT 有效期。
# 数据仍按脚本采集到的 Asia/Shanghai 本地小时归档，与触发时刻无关。
on:
  # 配置自检：改动本文件时立即跑一次，用于确认采集链路可用。
  # 数据提交只改 data/online/**，不匹配这里的 paths，因此不会自触发成死循环。
  push:
    paths:
      - '.github/workflows/collect-online-stats.yml'
  # 主触发入口：Cloudflare Worker 调用；也可在 Actions 页面手动 Run workflow。
  workflow_dispatch:
    inputs:
      date:
        description: '可选：手动补录日期 YYYY-MM-DD'
        required: false
      hour:
        description: '可选：手动补录小时 0-23'
        required: false

permissions:
  contents: write

# 与 update-pages-json.yml 的整点任务错开：Worker 在每小时第 30 分触发，避免同时 push 产生冲突
concurrency:
  group: kosto-hourly-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch balancer snapshot and archive
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_HOUR: ${{ inputs.hour }}
        run: |
          ARGS=""
          if [ -n "$INPUT_DATE" ]; then ARGS="$ARGS --date $INPUT_DATE"; fi
          if [ -n "$INPUT_HOUR" ]; then ARGS="$ARGS --hour $INPUT_HOUR"; fi
          python scripts/fetch_online_stats.py $ARGS

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data/online)" ]; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          # 其它整点任务可能已经推过，先 rebase 再提交
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add data/online
          git commit -m "chore(data): hourly CN online stats $(date -u +'%Y-%m-%dT%H:00Z')"
          git push

<!DOCTYPE html>
<html>
<head>
    <title>KOSTO 适配版测试</title>
</head>
<body>
    <h2>KOSTO 专用 API 测试 (SSE 格式)</h2>
    <input type="text" id="url" style="width:400px" value="https://kostotranslate.kosto.workers.dev/">
    <button onclick="test()">点击测试</button>
    <pre id="out" style="background:#000; color:#0f0; padding:10px; margin-top:10px"></pre>

    <script>
        async function test() {
            const out = document.getElementById('out');
            out.textContent = "请求中...";
            try {
                const res = await fetch(document.getElementById('url').value, {
                    method: 'POST',
                    body: JSON.stringify({text: "1|||Hello\n2|||Welcome"})
                });
                const text = await res.text();
                out.textContent = "原始响应内容：\n" + text;

                // 模拟油猴脚本的解析逻辑
                if (text.startsWith("data: ")) {
                    const jsonStr = text.replace("data: ", "").trim();
                    const parsed = JSON.parse(jsonStr);
                    const result = parsed.candidates[0].content.parts[0].text;
                    out.textContent += "\n\n解析成功！翻译结果：\n" + result;
                } else {
                    out.textContent += "\n\n❌ 格式错误：没有以 'data: ' 开头";
                }
            } catch (e) {
                out.textContent = "错误：" + e.message;
            }
        }
    </script>
</body>
</html>1
